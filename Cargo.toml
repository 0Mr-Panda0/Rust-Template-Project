[package]
name = "rust-template-project"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A modern Rust template project with Nix/Devenv integration"
license = "CC0-1.0"
repository = "https://github.com/0Mr-Panda0/Rust-Template-Project"
readme = "README.md"
authors = ["0Mr-Panda0 <karan.behera366@gmail.com>"]

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
color-eyre = "0.6"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
divan = "0.1"

[[bench]]
name = "greeting_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
