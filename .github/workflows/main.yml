name: CI for Rust CLI App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-nix:
    name: Test (Nix)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Set up Cachix (Optimizes Nix package caching)
        uses: cachix/cachix-action@v17
        with:
          name: devenv

      - name: Install Devenv CLI
        run: nix profile install nixpkgs#devenv

      - name: Run Formatter Check (Cargo Format)
        run: devenv shell format-check

      - name: Run Linter (Cargo Clippy)
        run: devenv shell lint

      - name: Run Unit Tests (Cargo Test)
        run: devenv shell unit-test

      - name: Run Devenv Tests & Pre-commit Hooks
        run: devenv test

  test-normal:
    name: Test (Non-Nix)
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Formatter (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Linter (cargo clippy)
        run: cargo clippy -- -D warnings

      - name: Run Unit Tests (cargo test)
        run: cargo test -- --nocapture

  test-msrv:
    name: Test MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85.0"

      - name: Verify compilation on MSRV
        run: cargo check --all-targets

  security-audit:
    name: Security & License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate code coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: code-coverage-report
          path: lcov.info
